name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to test on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string
  workflow_call:
    inputs:
      runners:
        type: string
      profile:
        type: string
        default: debug

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACH_REF: 861a757c8543ca46d96f064e33afce730db5bccb
  PROFILE: ${{ inputs.profile || 'debug' }}

jobs:
  # every runner builds every artifact for every target and tests the ones it can run
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # until a 7.x release exists, the compiler is built from the mach commit
      # pinned in MACH_REF
      - name: restore the pinned mach
        id: mach
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_REF }}
      - name: build mach at MACH_REF
        if: steps.mach.outputs.cache-hit != 'true'
        run: |
          exe=
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          git init --quiet "$RUNNER_TEMP/mach-src"
          git -C "$RUNNER_TEMP/mach-src" remote add origin https://github.com/briar-systems/mach
          git -C "$RUNNER_TEMP/mach-src" fetch --quiet --depth 1 origin "$MACH_REF"
          git -C "$RUNNER_TEMP/mach-src" checkout --quiet FETCH_HEAD
          (cd "$RUNNER_TEMP/mach-src" && bash .github/scripts/bootstrap.sh)
          mkdir -p "$RUNNER_TEMP/mach"
          cp "$(sed -n 's/^MACH=//p' "$GITHUB_ENV" | tail -n 1)" "$RUNNER_TEMP/mach/mach$exe"
      - name: add mach to PATH
        run: echo "$RUNNER_TEMP/mach" >> "$GITHUB_PATH"
      - run: mach dep pull .
      - if: strategy.job-index == 0
        run: mach fmt --check .
      # the host target only: the other targets link a libc.so.6 this runner does not hold
      - run: mach test . -p "$PROFILE"

  gate:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
